<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RankKings: descubre, comparte y organiza tus rankings de música, libros y películas.">
    <title>RankKings</title>
    <link href="./dist/output.css" rel="stylesheet">
    <script src="./src/user-profile.js" type="module"></script>
    
</head>


<body class="bg-rk-dark text-rk-light">
    <!-- Componente: navegación global de la aplicación. -->
    <header class="sticky top-0 z-50 bg-rk-dark border-b border-rk-light">
        <nav class="mx-auto flex max-w-6xl items-center gap-4 px-6 py-4">
            <!-- Logo -->
            <a href="#" class="shrink-0 text-lg font-semibold tracking-tight text-rk-accent">
                <h1>RankKings</h1>
            </a>

            <!-- Links de escritorio -->
            <ul class="hidden shrink-0 items-center gap-6 md:flex">
                <li class="relative">
                    <button
                        id="categorias-btn"
                        class="flex items-center gap-1 text-sm text-rk-light transition-colors hover:text-rk-accent"
                        aria-haspopup="true"
                        aria-expanded="false"
                    >
                        Categorías
                        <svg id="categorias-chevron" class="h-3.5 w-3.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div
                        id="categorias-menu"
                        class="hidden absolute left-0 mt-2 w-48 rounded-xl border border-rk-light bg-rk-dark py-2 shadow-lg"
                    >
                        <a href="#musica" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Música</a>
                        <a href="#libros" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Libros</a>
                        <a href="#peliculas" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Películas</a>
                        <a href="#listas" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Listas</a>
                    </div>
                </li>
                <li><a href="#Lanzamientos" class="text-sm text-rk-light transition-colors hover:text-rk-accent">Para ti</a></li>
            </ul>

            <!-- Barra de búsqueda y botón + -->
            <div class="hidden flex-1 md:flex md:items-center md:gap-2 max-w-md">
                <div class="relative flex-1">
                    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-rk-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M18 10.5a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" />
                    </svg>
                    <input
                        type="text"
                        placeholder="Buscar…"
                        class="w-full rounded-full border border-rk-light bg-rk-dark py-2 pl-9 pr-4 text-sm text-rk-light outline-none transition-colors focus:border-rk-accent focus:bg-rk-light"
                    />
                </div>
                <button id="create-btn" aria-label="Publicar" title="Publicar" class="flex aspect-square h-9 w-9 shrink-0 items-center justify-center rounded-full bg-rk-accent text-rk-dark transition-transform hover:scale-105">
                    <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </button>
            </div>

            <!-- Acciones a la derecha -->
            <div class="ml-auto flex shrink-0 items-center gap-3">
                <!-- Botón que abre la búsqueda (solo móvil) -->
                <button id="search-btn-mobile" aria-label="Buscar" aria-expanded="false" class="flex h-9 w-9 items-center justify-center rounded-full text-rk-light hover:bg-rk-accent md:hidden">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M18 10.5a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" />
                    </svg>
                </button>

                <!-- Botón crear (solo móvil) -->
                <button id="create-btn-mobile" aria-label="Publicar" class="flex h-9 w-9 items-center justify-center rounded-full bg-rk-accent text-rk-dark md:hidden">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </button>

                <!-- Perfil con menú desplegable -->
                <div class="relative">
                    <button id="profile-btn" class="flex items-center gap-2 rounded-full p-1 pr-2 hover:bg-rk-accent" aria-haspopup="true" aria-expanded="false">
                        <img src="https://definicion.de/wp-content/uploads/2019/07/perfil-de-usuario.png" alt="" class="h-8 w-8 rounded-full object-cover"/>
                        <svg id="profile-chevron" class="h-4 w-4 text-rk-light transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div
                    id="profile-menu"
                    class="hidden absolute right-0 mt-2 w-56 rounded-xl border border-rk-light bg-rk-dark py-2 shadow-lg"
                    >
                    <div class="border-b border-rk-light px-4 py-2.5">
                        <p class="text-sm font-medium text-rk-accent">Usuario</p>
                        <p class="text-xs text-rk-light">ejemplo@correo.com</p>
                    </div>
                    <a href="#perfil" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Ver perfil</a>
                    <a href="#ajustes" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Configuración</a>
                    <a href="#membresia" class="block px-4 py-2 text-sm text-rk-light hover:bg-rk-dark">Membresía</a>
                    <div class="my-1 border-t border-rk-light"></div>
                    <a href="#salir" class="block px-4 py-2 text-sm text-red-500 hover:bg-rk-accent">Cerrar sesión</a>
                    </div>
                </div>

                <!-- Botón menú móvil -->
                <button
                    id="menu-btn"
                    class="inline-flex items-center justify-center rounded-md p-2 text-rk-accent md:hidden"
                    aria-label="Abrir menú"
                    aria-expanded="false"
                >
                    <svg id="icon-open" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg id="icon-close" class="hidden h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Barra de búsqueda móvil: fuera de la fila de íconos, ocupa todo el ancho del header -->
        <div id="mobile-search-bar" class="hidden border-t border-rk-light px-6 py-3 md:hidden">
            <div class="relative flex items-center gap-2">
                <div class="relative flex-1">
                    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-rk-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M18 10.5a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z" />
                    </svg>
                    <input id="mobile-search-input" type="text" placeholder="Buscar…" class="w-full rounded-full border border-rk-light bg-rk-accent py-2 pl-9 pr-4 text-sm text-rk-light outline-none transition-colors focus:border-rk-accent focus:bg-rk-dark"/>
                </div>
                <button id="close-search-mobile" aria-label="Cerrar búsqueda" class="shrink-0 rounded-md p-2 text-rk-light hover:bg-rk-accent">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Panel móvil -->
        <div id="mobile-panel" class="hidden border-t border-rk-accent md:hidden">
            <ul class="flex flex-col gap-1 px-6 py-4">
                <li>
                    <button id="categorias-btn-mobile" class="flex w-full items-center justify-between rounded-md px-2 py-2.5 text-sm text-rk-light hover:bg-rk-accent">
                        Categorías
                        <svg id="categorias-chevron-mobile" class="h-4 w-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <div id="categorias-submenu-mobile" class="hidden flex-col gap-1 pl-4">
                        <a href="#musica" class="block rounded-md px-2 py-2 text-sm text-rk-light hover:bg-rk-accent">Música</a>
                        <a href="#libros" class="block rounded-md px-2 py-2 text-sm text-rk-light hover:bg-rk-accent">Libros</a>
                        <a href="#peliculas" class="block rounded-md px-2 py-2 text-sm text-rk-light hover:bg-rk-accent">Películas</a>
                        <a href="#listas" class="block rounded-md px-2 py-2 text-sm text-rk-light hover:bg-rk-accent">Listas</a>
                    </div>
                </li>
                <li><a href="#Lanzamientos" class="block rounded-md px-2 py-2.5 text-sm text-rk-light hover:bg-rk-accent">Para ti</a></li>
            </ul>
        </div>
    </header>


    <main id="inicio" class="w-full px-4 py-8">
        
        

        <!-- Biblioteca de publicaciones: cuadrícula simple de cuadrados clickeables -->
        <section class="mt-10 mx-auto w-full max-w-3xl">
            <h2 class="mb-4 text-base font-medium text-rk-light">Publicaciones</h2>

            <!-- El JS llena este contenedor con un cuadrado por publicación -->
            <div id="publicaciones-grid" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));"></div>
        </section>
    </main>
    

    <footer class="theme-chrome theme-chrome-text p-4 text-center">
        <p>&copy; 2026 RankKings. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
